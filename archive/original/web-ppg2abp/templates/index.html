<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPG2ABP 实时血压监测</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
        }
        
        .header h1 {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #8892b0;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            display: inline-block;
            margin-right: 8px;
            transition: all 0.3s;
        }
        
        .status-dot.connected {
            background: #2ed573;
            box-shadow: 0 0 10px #2ed573;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 控制按钮 */
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            padding: 12px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 10px;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
        }
        
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* 血压卡片 */
        .bp-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        
        .bp-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .bp-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 210, 255, 0.3);
        }
        
        .bp-card .label {
            font-size: 0.9em;
            color: #8892b0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .bp-card .value {
            font-size: 3.5em;
            font-weight: 200;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        .bp-card .unit {
            font-size: 0.8em;
            color: #8892b0;
        }
        
        .bp-card.sbp .value { color: #ff6b81; }
        .bp-card.dbp .value { color: #7bed9f; }
        .bp-card.map .value { color: #00d2ff; }
        
        /* 状态指示 */
        .bp-status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.2em;
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 500;
        }
        
        .status-badge.normal { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
        .status-badge.elevated { background: rgba(255, 165, 2, 0.2); color: #ffa502; }
        .status-badge.high1 { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .status-badge.high2 { background: rgba(255, 71, 87, 0.3); color: #ff4757; }
        .status-badge.high3 { background: rgba(255, 71, 87, 0.4); color: #ff4757; }
        
        /* 图表区域 */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
        }
        
        .chart-container.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-title {
            font-size: 0.9em;
            color: #8892b0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        canvas {
            width: 100% !important;
        }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 30px 0;
            color: #8892b0;
            font-size: 0.85em;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .bp-cards { grid-template-columns: 1fr; }
            .charts { grid-template-columns: 1fr; }
            .bp-card .value { font-size: 2.5em; }
        }
        
        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            width: 400px;
            max-width: 90%;
        }
        .modal h3 {
            margin-top: 0;
            color: #00d2ff;
        }
        .modal label {
            display: block;
            margin: 15px 0 5px;
            color: #8892b0;
        }
        .modal input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
        }
        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-small {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-confirm { background: #00d2ff; color: #000; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-tool {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            background: transparent;
            color: #8892b0;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        .btn-tool:hover {
            border-color: #00d2ff;
            color: #00d2ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>PPG2ABP 血压监测</h1>
            <div class="status-bar">
                <span>
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">未连接</span>
                </span>
                <span id="portInfo">COM37</span>
                <span id="sampleInfo">100Hz → 125Hz</span>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-start" id="btnStart" onclick="startMeasurement()">
                开始测量
            </button>
            <button class="btn btn-stop" id="btnStop" onclick="stopMeasurement()" disabled>
                停止
            </button>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn-tool" onclick="exportCSV()">📥 导出记录</button>
                <button class="btn-tool" onclick="exportPPG()">📥 导出 PPG 波形</button>
                <button class="btn-tool" onclick="showCalibration()">🎯 校准血压</button>
                <button class="btn-tool" onclick="resetCalibration()">↺ 重置校准</button>
            </div>
            <div id="calibrationInfo" style="margin-top: 10px; color: #8892b0; font-size: 0.85em;"></div>
        </div>
        
        <!-- 血压卡片 -->
        <div class="bp-cards">
            <div class="bp-card sbp">
                <div class="label">收缩压 SBP</div>
                <div class="value" id="sbpValue">--</div>
                <div class="unit">mmHg</div>
            </div>
            <div class="bp-card dbp">
                <div class="label">舒张压 DBP</div>
                <div class="value" id="dbpValue">--</div>
                <div class="unit">mmHg</div>
            </div>
            <div class="bp-card map">
                <div class="label">平均压 MAP</div>
                <div class="value" id="mapValue">--</div>
                <div class="unit">mmHg</div>
            </div>
        </div>
        
        <!-- 状态 -->
        <div class="bp-status">
            <span class="status-badge normal" id="bpStatus">等待测量...</span>
        </div>
        
        <!-- 图表 -->
        <div class="charts">
            <div class="chart-container full-width">
                <div class="chart-title">PPG 信号波形</div>
                <canvas id="ppgChart" height="150"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">血压趋势</div>
                <canvas id="trendChart" height="200"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">测量信息</div>
                <div style="padding: 20px; color: #8892b0; line-height: 2;">
                    <div>采样率: <span style="color:#fff">100Hz → 125Hz</span></div>
                    <div>采集时长: <span style="color:#fff">8.2 秒/次</span></div>
                    <div>信号长度: <span style="color:#fff">1024 点</span></div>
                    <div>模型: <span style="color:#fff">UNetDS64 + MultiResUNet1D</span></div>
                    <div>测量次数: <span style="color:#fff" id="measureCount">0</span></div>
                </div>
            </div>
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            PPG2ABP - 基于深度学习的无创连续血压监测系统
        </div>
    </div>
    
    <!-- 校准模态框 -->
    <div class="modal-overlay" id="calibrationModal">
        <div class="modal">
            <h3>🎯 血压校准</h3>
            <p style="color: #8892b0; font-size: 0.9em;">
                用袖带血压计测量一次参考值，输入后系统会自动计算偏移量。
            </p>
            <label>袖带收缩压 (SBP) mmHg</label>
            <input type="number" id="refSbp" placeholder="例如: 120" min="60" max="250">
            <label>袖带舒张压 (DBP) mmHg</label>
            <input type="number" id="refDbp" placeholder="例如: 80" min="30" max="150">
            <div class="modal-buttons">
                <button class="btn-small btn-cancel" onclick="closeCalibration()">取消</button>
                <button class="btn-small btn-confirm" onclick="doCalibration()">确认校准</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        
        // 图表配置
        const ppgCtx = document.getElementById('ppgChart').getContext('2d');
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        
        // PPG 波形图
        const ppgChart = new Chart(ppgCtx, {
            type: 'line',
            data: {
                labels: Array.from({length: 1024}, (_, i) => i),
                datasets: [{
                    data: new Array(1024).fill(0),
                    borderColor: '#00d2ff',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#8892b0' }
                    }
                }
            }
        });
        
        // 血压趋势图
        const trendChart = new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'SBP',
                        data: [],
                        borderColor: '#ff6b81',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#ff6b81',
                        fill: false,
                        tension: 0.3
                    },
                    {
                        label: 'MAP',
                        data: [],
                        borderColor: '#00d2ff',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#00d2ff',
                        fill: false,
                        tension: 0.3
                    },
                    {
                        label: 'DBP',
                        data: [],
                        borderColor: '#7bed9f',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#7bed9f',
                        fill: false,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: {
                    legend: {
                        labels: { color: '#8892b0' }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#8892b0' }
                    },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#8892b0' },
                        suggestedMin: 40,
                        suggestedMax: 200
                    }
                }
            }
        });
        
        let measureCount = 0;
        
        // 接收数据
        socket.on('bp_data', function(data) {
            // 更新血压值
            document.getElementById('sbpValue').textContent = data.sbp;
            document.getElementById('dbpValue').textContent = data.dbp;
            document.getElementById('mapValue').textContent = data.map;
            
            // 更新状态
            const statusEl = document.getElementById('bpStatus');
            statusEl.textContent = data.status;
            statusEl.className = 'status-badge ' + data.status_class;
            
            // 更新 PPG 波形
            ppgChart.data.datasets[0].data = data.ppg;
            ppgChart.update();
            
            // 更新趋势图
            const history = data.history;
            trendChart.data.labels = history.map((_, i) => i + 1);
            trendChart.data.datasets[0].data = history.map(h => h.sbp);
            trendChart.data.datasets[1].data = history.map(h => h.map);
            trendChart.data.datasets[2].data = history.map(h => h.dbp);
            trendChart.update();
            
            // 更新计数
            measureCount++;
            document.getElementById('measureCount').textContent = measureCount;
        });
        
        // 状态更新
        socket.on('status', function(data) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (data.connected) {
                dot.classList.add('connected');
                text.textContent = '已连接';
            } else {
                dot.classList.remove('connected');
                text.textContent = '未连接';
            }
            
            if (data.port) {
                document.getElementById('portInfo').textContent = data.port;
            }
        });
        
        // 错误处理
        socket.on('error', function(data) {
            alert('错误: ' + data.message);
        });
        
        // 开始测量
        function startMeasurement() {
            const port = prompt('请输入串口号:', 'COM37');
            if (!port) return;
            
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
            socket.emit('start', { port: port });
        }
        
        // 停止测量
        function stopMeasurement() {
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
            socket.emit('stop');
        }
        
        // 导出 CSV
        function exportCSV() {
            window.location.href = '/export';
        }
        
        // 导出 PPG 波形
        function exportPPG() {
            // 检查是否有测量数据
            if (measureCount === 0) {
                alert('暂无测量数据，请先开始测量');
                return;
            }
            window.location.href = '/export_ppg';
        }
        
        // 显示校准模态框
        function showCalibration() {
            document.getElementById('calibrationModal').classList.add('active');
        }
        
        // 关闭校准模态框
        function closeCalibration() {
            document.getElementById('calibrationModal').classList.remove('active');
        }
        
        // 执行校准
        function doCalibration() {
            const sbp = document.getElementById('refSbp').value;
            const dbp = document.getElementById('refDbp').value;
            
            if (!sbp || !dbp) {
                alert('请输入袖带血压值');
                return;
            }
            
            socket.emit('calibrate', { sbp: parseFloat(sbp), dbp: parseFloat(dbp) });
            closeCalibration();
        }
        
        // 重置校准
        function resetCalibration() {
            if (confirm('确定要重置校准吗？')) {
                socket.emit('reset_calibration');
            }
        }
        
        // 接收校准结果
        socket.on('calibrated', function(data) {
            const info = document.getElementById('calibrationInfo');
            if (data.sbp_offset === 0 && data.dbp_offset === 0) {
                info.textContent = '校准已重置';
            } else {
                info.textContent = `校准偏移: SBP ${data.sbp_offset > 0 ? '+' : ''}${data.sbp_offset}, DBP ${data.dbp_offset > 0 ? '+' : ''}${data.dbp_offset}, MAP ${data.map_offset > 0 ? '+' : ''}${data.map_offset}`;
            }
        });
    </script>
</body>
</html>
